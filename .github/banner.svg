<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Web Terminal — a full terminal in one PHP file, plus a Python CLI client">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141622"/>
      <stop offset="55%" stop-color="#1a1c29"/>
      <stop offset="100%" stop-color="#101221"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c8cff"/>
      <stop offset="100%" stop-color="#56d4dd"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8c6ff"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#4a5fc1" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#4a5fc1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#56d4dd" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#56d4dd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="880" height="4" fill="url(#accent)"/>

  <!-- soft glow -->
  <circle cx="742" cy="46" r="220" fill="url(#glow1)"/>
  <circle cx="120" cy="272" r="200" fill="url(#glow2)"/>

  <!-- window chrome -->
  <rect x="60" y="176" width="760" height="86" rx="10" fill="#0c0e18" stroke="#3d415c"/>
  <circle cx="86" cy="196" r="5" fill="#ff5f57"/>
  <circle cx="104" cy="196" r="5" fill="#febc2e"/>
  <circle cx="122" cy="196" r="5" fill="#28c840"/>
  <text x="440" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6a75a1" text-anchor="middle">web_terminal.php</text>

  <!-- prompt lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="82" y="224" fill="#6cffa0">$</text>
    <text x="98" y="224" fill="#f5f5f5">pwd</text>
    <text x="134" y="224" fill="#9da5b4">/var/www/html</text>
    <text x="82" y="248" fill="#6cffa0">$</text>
    <text x="98" y="248" fill="#f5f5f5">composer install</text>
    <rect x="238" y="237" width="9" height="15" fill="#6c8cff"/>
    <text x="300" y="248" fill="#56d4dd">streaming output…</text>
  </g>

  <!-- title -->
  <text x="440" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="url(#title)" text-anchor="middle">Web Terminal</text>
  <text x="440" y="122" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#c3cbe6" text-anchor="middle">A real shell for shared hosting — in your browser and in your own terminal.</text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="188" y="140" width="120" height="26" rx="13" fill="#232637" stroke="#3d415c"/>
    <text x="248" y="157" fill="#c3cbe6" text-anchor="middle">one PHP file</text>
    <rect x="316" y="140" width="132" height="26" rx="13" fill="#232637" stroke="#3d415c"/>
    <text x="382" y="157" fill="#c3cbe6" text-anchor="middle">one Python file</text>
    <rect x="456" y="140" width="112" height="26" rx="13" fill="#232637" stroke="#3d415c"/>
    <text x="512" y="157" fill="#c3cbe6" text-anchor="middle">no deps</text>
    <rect x="576" y="140" width="116" height="26" rx="13" fill="#232637" stroke="#3d415c"/>
    <text x="634" y="157" fill="#c3cbe6" text-anchor="middle">no PHP timeouts</text>
  </g>
</svg>